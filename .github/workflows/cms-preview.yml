name: CMS draft preview link

on:
  deployment_status:

permissions:
  statuses: write

jobs:
  preview-link:
    if: github.event.deployment.environment == 'Preview – aarav-yoga-x9f9'
    runs-on: ubuntu-latest
    steps:
      # No draft code is checked out or executed by this workflow.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { deployment, deployment_status: status } = context.payload;
            if (deployment.environment !== 'Preview – aarav-yoga-x9f9') return;
            if (!/^[a-f0-9]{40}$/i.test(deployment.sha)) return;
            const states = { success: 'success', failure: 'failure', error: 'error', pending: 'pending', queued: 'pending', in_progress: 'pending' };
            const state = states[status.state];
            if (!state) return;
            let url;
            try { url = new URL(status.environment_url); } catch { return; }
            if (url.protocol !== 'https:' || url.username || url.password || url.port || !/^aarav-yoga-x9f9-[a-z0-9-]+\.vercel\.app$/.test(url.hostname)) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: deployment.sha,
              state,
              context: 'deploy-preview/aarav-yoga-x9f9',
              target_url: url.origin,
              description: state === 'success' ? 'Draft website preview is ready' : 'Draft website preview: ' + state,
            });
